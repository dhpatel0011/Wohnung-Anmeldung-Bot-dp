name: Kleinanzeigen Car Bot (Selenium Edition)

on:
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows bot to push state and CSV back to GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Kleinanzeigen Scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL2: ${{ secrets.ALERT_EMAIL2 }}
          MAX_PAGES: "2"
        run: python car_scraper.py

      - name: Commit and push updated cache and CSV results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch seen_cars.json results.csv
          git add seen_cars.json results.csv
          git diff-index --quiet HEAD || (git commit -m "Auto-update car listings state & results.csv [skip ci]" && git push)
