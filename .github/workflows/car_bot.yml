name: Multi-Platform Car Scraper Bot

on:
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows GitHub Action to commit index.html & CSV back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Multi-Platform Scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL2: ${{ secrets.ALERT_EMAIL2 }}
          MAX_PAGES: "2"
        run: python car_scraper.py

      - name: Generate Visual HTML Feed
        run: |
          if [ -f generate_visual_feed.py ]; then
            python generate_visual_feed.py
          fi

      - name: Commit and Push Updated Results and Visual Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch seen_cars.json results.csv urls.txt index.html
          git add seen_cars.json results.csv urls.txt index.html
          git diff-index --quiet HEAD || (git commit -m "Auto-update car listings & visual HTML feed [skip ci]" && git push)
